name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run tests
        run: make test

      - name: Run integration tests
        run: make test-integration

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.8
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Run gofmt check
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -s -l .
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Homebrew tap update runs as its own job so it can be re-run in isolation
  # (e.g. after rotating TAP_GITHUB_TOKEN) without re-running GoReleaser, which
  # fails with "asset already_exists" once a tag has been released. It depends
  # only on the release existing and the source tarball (not GoReleaser's
  # artifacts), so `needs: goreleaser` is purely an ordering/success gate.
  #
  # The tap's default branch only accepts changes through a pull request, so
  # scripts/update-homebrew-tap.sh opens one and merges it (auto-merge, else a
  # direct merge, else a warning naming the PR to merge by hand). It is
  # idempotent, so a re-run reuses the branch and PR, or does nothing once the
  # tap is current. TAP_GITHUB_TOKEN needs Contents and Pull requests write on
  # lost-in-the/homebrew-tap. scripts/test-update-homebrew-tap.sh exercises it
  # in CI against a fake API.
  homebrew:
    name: Update Homebrew formula
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Homebrew formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: scripts/update-homebrew-tap.sh "${GITHUB_REF_NAME}"
