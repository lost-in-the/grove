name: CI

on:
  push:
    branches: [ main, 'copilot/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: go test -race -cover ./...

      # macOS runners don't have Docker installed, and the plugins/docker
      # unit tests assume `docker` is on PATH. Skip that package on macOS;
      # everything else (including symlink and path-handling code paths
      # this matrix exists to cover) still runs.
      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: |
          PKGS=$(go list ./... | grep -v '/plugins/docker$')
          go test -race -cover $PKGS

  integration:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        run: make test-integration

  # grove's herdr backend and plugin against a real, headless herdr server.
  # Unit tests pin grove's side of the contract with captured responses; this
  # is what catches herdr changing its side. herdr ships as a single static
  # binary, so there is nothing to install beyond it.
  herdr:
    name: herdr End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Pinned release and its published SHA-256 (distribution/latest.json in
      # herdrdev/herdr). Bump both together.
      HERDR_VERSION: 0.9.1
      HERDR_SHA256: 2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install herdr
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/herdr" \
            "https://github.com/herdrdev/herdr/releases/download/v${HERDR_VERSION}/herdr-linux-x86_64"
          echo "${HERDR_SHA256}  $HOME/.local/bin/herdr" | sha256sum -c -
          chmod +x "$HOME/.local/bin/herdr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The plugin's hooks run `grove` from the herdr server's PATH, so the
      # build under test has to be there before the server starts.
      - name: Install grove
        run: go build -o "$HOME/.local/bin/grove" ./cmd/grove

      - name: Start a headless herdr server
        run: |
          nohup herdr server > "$RUNNER_TEMP/herdr-server.log" 2>&1 &
          for _ in $(seq 1 50); do
            herdr status server | grep -q '^status: running' && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/herdr-server.log"
          exit 1

      - name: Validate grove against herdr
        run: scripts/validate-herdr.sh --plugin --stop-server

      - name: herdr logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/herdr-server.log" || true
          cat "$HOME/.config/herdr/herdr-server.log" || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.8
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Run gofmt check
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -s -l .
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: grove-binary
          path: bin/grove
